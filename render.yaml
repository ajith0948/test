services:
  # ── Backend: Node/Express API ──────────────────────────────────────────────
  - type: web
    name: assetflow-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Comma-separated list of allowed frontend origins (CORS).
      # Render appended a suffix to the frontend's name since "assetflow-frontend"
      # was already taken - this must match the actual deployed frontend URL.
      - key: FRONTEND_URL
        value: https://assetflow-frontend-3bm9.onrender.com

  # ── Frontend: Vite/React static site ───────────────────────────────────────
  - type: web
    name: assetflow-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Render appended a suffix to the backend's name since "assetflow-backend"
      # was already taken - this must match the actual deployed backend URL.
      - key: VITE_API_URL
        value: https://assetflow-backend-f54m.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
